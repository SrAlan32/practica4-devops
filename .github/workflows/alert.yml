name: Alerta

on:
  push:
    branches:
      - main

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enviar notificacion a ntfy
        run: |
          curl -d "Nuevo push a main en ${{ github.repository }} por ${{ github.actor }}" https://ntfy.sh/devops-itla